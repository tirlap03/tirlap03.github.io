# Site settings for GitHub Pages (Jekyll)
title: Your linking key
description: Generate an anonymous linking key to use in all three forms.
lang: en

# The site is a single self-contained HTML page, so no theme or plugins are needed.
theme: null
plugins: []

# Serve the page as-is. index.html has no front matter, so Jekyll copies it unchanged.
markdown: kramdown

# Keep repository housekeeping files off the published site.
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - .vscode/
